services:

  web:
    build: .
    container_name: booka_web
    command: python core/manage.py runserver 0.0.0.0:8000
    # command: gunicorn core.booka.wsgi 
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    container_name: booka_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: booka_redis

  celery:
    build: .
    container_name: booka_celery
    working_dir: /app/core
    command: celery -A booka worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: booka_celery_beat
    working_dir: /app/core
    command: celery -A booka beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
  locust:
    image: locustio/locust
    volumes:
      - ./core/booka/locust:/mnt/locust
    ports:
      - "8089:8089"
    command: -f /mnt/locust/locustfile.py

volumes:
  postgres_data: